name: Build and Publish Docker Image

on:
  push:
    branches:
      - dev
      - release
    paths:
      - 'UltrasharpTools.RemoteServer/**'
      - 'UltrasharpTools.Tools/**'
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Debug/Release)'
        required: false
        type: choice
        options:
          - Debug
          - Release

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ultrasharp-tools-remote-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine build configuration
        id: config
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CONFIG="${{ inputs.configuration }}"
          elif [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            CONFIG="Debug"
          elif [ "${{ github.ref }}" == "refs/heads/release" ]; then
            CONFIG="Release"
          else
            CONFIG="Debug"
          fi
          echo "BUILD_CONFIGURATION=$CONFIG" >> $GITHUB_OUTPUT
          echo "Building with configuration: $CONFIG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Branch-based tags
            type=ref,event=branch
            # SHA tags
            type=sha,prefix={{branch}}-
            # Latest tag for release branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' }}
            # Configuration-specific tags
            type=raw,value={{branch}}-${{ steps.config.outputs.BUILD_CONFIGURATION }},enable=true
          flavor: |
            latest=false

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_CONFIGURATION=${{ steps.config.outputs.BUILD_CONFIGURATION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Output image tags
        run: |
          echo "### Docker Image Published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:** \`${{ steps.config.outputs.BUILD_CONFIGURATION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
